<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>TOEIC 単語トレーナー</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#68758a;--blue:#1662d4;--navy:#17324d;--green:#16763a;--red:#b74519;--line:#dbe3ee}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:780px;margin:auto;padding:18px} header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 16px}
h1{font-size:clamp(23px,5vw,32px);margin:0;color:var(--navy)} .tag{padding:6px 10px;border-radius:999px;background:#dbeafe;color:#174c9d;font-size:12px;font-weight:700}
.panel{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 8px 26px #183b6414;margin-bottom:14px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px} label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
select,button{font:inherit} select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}
.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px} .bar{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden} .bar>div{height:100%;background:var(--blue);width:0}
.card{min-height:395px;text-align:center;display:flex;flex-direction:column;justify-content:center} .word{font-size:clamp(42px,10vw,68px);font-weight:800;color:var(--navy);overflow-wrap:anywhere;margin:15px 0 5px}
.pos{min-height:24px;color:var(--muted);font-style:italic} .answer{display:none;border-top:1px solid var(--line);margin:20px auto 0;padding-top:18px;max-width:600px}
.meaning{font-size:24px;font-weight:800} .example{font-size:17px;line-height:1.55;margin-top:14px} .example-ja{color:var(--muted);line-height:1.55}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px} button{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff;font-weight:750}
.show{grid-column:1/-1;color:#fff;background:var(--blue);border-color:var(--blue)} .no{color:var(--red);background:#fff7ed;border-color:#fdba74} .yes{color:var(--green);background:#f0fdf4;border-color:#86efac}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px} .stat{background:#f7f9fc;text-align:center;padding:11px 5px;border-radius:12px} .stat b{display:block;font-size:22px;color:var(--navy)} .stat span{font-size:11px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px} .tools button{padding:8px 10px;font-size:12px;color:var(--muted)} .note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
@media(max-width:560px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.panel{padding:16px}}
</style>
</head>
<body><main>
<header><h1>TOEIC 単語トレーナー</h1><span class="tag">100語版</span></header>
<section class="panel filters">
<div><label for="level">目標スコア</label><select id="level"><option value="470">470点</option><option value="600">600点</option><option value="730">730点</option><option value="860">860点</option></select></div>
<div><label for="mode">学習モード</label><select id="mode"><option value="normal">通常学習</option><option value="weak">苦手を優先</option><option value="review">習得済みを復習</option></select></div>
</section>
<section class="panel"><div class="progress-head"><span id="courseText"></span><span id="courseProgress"></span></div><div class="bar"><div id="bar"></div></div></section>
<section class="panel card">
<div id="status" class="progress-head" style="justify-content:center"></div><div id="word" class="word"></div><div id="pos" class="pos"></div>
<div id="answer" class="answer"><div id="meaning" class="meaning"></div><div id="example" class="example"></div><div id="exampleJa" class="example-ja"></div></div>
<div class="actions"><button id="show" class="show">答えを見る</button><button id="unknown" class="no">わからない</button><button id="known" class="yes">わかった</button></div>
</section>
<section class="panel"><div class="stats"><div class="stat"><b id="today">0</b><span>今日の回答</span></div><div class="stat"><b id="studied">0</b><span>学習済み</span></div><div class="stat"><b id="mastered">0</b><span>習得</span></div><div class="stat"><b id="rate">0%</b><span>わかった率</span></div></div>
<div class="tools"><button id="saveFile">履歴を保存</button><button id="loadFile">履歴を復元</button><button id="reset">履歴をリセット</button><input id="file" type="file" accept="application/json" hidden></div>
<div class="note">履歴はこのブラウザ内に自動保存されます。外部サービス、Microsoft 365、GitHub APIには接続しません。</div></section>
</main>

const STORAGE_KEY='toeic-vocab-trainer-v2';
const DEFAULT_STATE={progress:{},known:0,unknown:0,daily:{},settings:{level:'470',mode:'normal'}};
let state=load(); let current=null; let answerVisible=false;
const el=id=>document.getElementById(id);
function cloneDefault(){return JSON.parse(JSON.stringify(DEFAULT_STATE))}
function load(){try{const x=localStorage.getItem(STORAGE_KEY);return x?Object.assign(cloneDefault(),JSON.parse(x)):cloneDefault()}catch(e){return cloneDefault()}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.warn('Browser storage unavailable',e)}}
function day(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function prog(id){return state.progress[id]||{seen:0,yes:0,no:0,mastery:0,last:0,due:0}}
function pool(){const level=Number(el('level').value),mode=el('mode').value;let a=WORDS.filter(x=>x.level===level);if(mode==='weak'){const b=a.filter(x=>prog(x.id).mastery<3);if(b.length)a=b}if(mode==='review'){const b=a.filter(x=>prog(x.id).mastery>=3);if(b.length)a=b}return a}
function weight(x){const p=prog(x.id);let w=[12,9,6,3,1][Math.min(4,p.mastery)];if(!p.seen)w+=10;if(p.due<=state.known+state.unknown)w+=5;return w}
function pick(){let a=pool();if(a.length>1&&current)a=a.filter(x=>x.id!==current.id);let total=a.reduce((s,x)=>s+weight(x),0),r=Math.random()*total;current=a[0];for(const x of a){r-=weight(x);if(r<=0){current=x;break}}answerVisible=false;render()}
function render(){if(!current)return;el('word').textContent=current.word;el('pos').textContent=current.pos;el('meaning').textContent=current.meaning;el('example').textContent=current.example;el('exampleJa').textContent=current.exampleJa;el('answer').style.display=answerVisible?'block':'none';el('show').textContent=answerVisible?'答えを表示中':'答えを見る';const a=WORDS.filter(x=>x.level===Number(el('level').value)),done=a.filter(x=>prog(x.id).seen).length,master=a.filter(x=>prog(x.id).mastery>=3).length;el('status').textContent=current.level+'点目標';el('courseText').textContent='学習済み '+done+' / '+a.length+'語';el('courseProgress').textContent='習得 '+master+'語';el('bar').style.width=(done/a.length*100)+'%';stats()}
function answer(ok){const p=prog(current.id),n=state.known+state.unknown;p.seen++;p.last=Date.now();if(ok){p.yes++;p.mastery=Math.min(4,p.mastery+1);p.due=n+(p.mastery>=3?20:6);state.known++}else{p.no++;p.mastery=Math.max(0,p.mastery-1);p.due=n+3;state.unknown++}state.progress[current.id]=p;state.daily[day()]=(state.daily[day()]||0)+1;save();pick()}
function stats(){const p=Object.values(state.progress),total=state.known+state.unknown;el('today').textContent=state.daily[day()]||0;el('studied').textContent=p.filter(x=>x.seen).length;el('mastered').textContent=p.filter(x=>x.mastery>=3).length;el('rate').textContent=total?Math.round(state.known/total*100)+'%':'0%'}
el('show').onclick=()=>{answerVisible=true;render()};el('known').onclick=()=>answer(true);el('unknown').onclick=()=>answer(false);
el('level').value=state.settings.level||'470';el('mode').value=state.settings.mode||'normal';
el('level').onchange=()=>{state.settings.level=el('level').value;save();pick()};el('mode').onchange=()=>{state.settings.mode=el('mode').value;save();pick()};
el('reset').onclick=()=>{if(confirm('学習履歴をすべて削除しますか？')){state=cloneDefault();el('level').value='470';el('mode').value='normal';save();pick()}};
el('saveFile').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='toeic-learning-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
el('loadFile').onclick=()=>el('file').click();el('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=Object.assign(cloneDefault(),JSON.parse(r.result));save();el('level').value=state.settings.level||'470';el('mode').value=state.settings.mode||'normal';pick();alert('履歴を復元しました。')}catch(err){alert('履歴ファイルを読み込めませんでした。')}};r.readAsText(f)};
pick();
</script></body></html>
